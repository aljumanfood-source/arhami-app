<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرحامي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E2;
    --paper-deep:#EFE6CE;
    --card:#FFFDF7;
    --ink:#2B2118;
    --ink-soft:#6B5C48;
    --muted:#8A7B65;
    --green:#145C43;
    --green-deep:#0D4433;
    --gold:#B8863B;
    --gold-soft:#E7D3A3;
    --red:#8B2635;
    --line: rgba(43,33,24,0.12);
    --purple-deep:#3A1642;
    --purple:#54205F;
    --gold-rich:#C9A227;
    --gold-line:#E3C669;
    --maroon:#8B3A4A;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0;
    background-color:var(--purple-deep);
    background-image:
      repeating-linear-gradient(45deg, var(--gold-line) 0 2px, transparent 2px 20px),
      repeating-linear-gradient(-45deg, var(--gold-line) 0 2px, transparent 2px 20px);
    padding:12px;
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;margin:0 auto;height:calc(100vh - 24px);display:flex;flex-direction:column;position:relative;
    background:var(--paper);
    border:3px solid var(--gold-rich);
    border-radius:26px;
    box-shadow:inset 0 0 0 6px var(--purple-deep), inset 0 0 0 8px var(--gold-line);
    overflow:hidden;
  }

  /* header — decorative arch line behind the title */
  header.top{
    position:relative;flex-shrink:0;padding:20px 18px 10px;overflow:hidden;
  }
  .arch-deco{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:88%;height:150px;z-index:0;pointer-events:none;
  }
  .brand{
    position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;padding-top:8px;
  }
  .brand h1{
    font-family:'Aref Ruqaa', 'Markazi Text', serif; font-weight:700; font-size:38px; margin:0;
    background:linear-gradient(180deg, var(--gold-rich) 0%, var(--green) 55%, var(--green-deep) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:1px;
  }

  .search-ornate{position:relative;z-index:1;border:1.5px solid var(--gold-rich);border-radius:20px;padding:3px;}
  .search-wrap{position:relative;}
  .search-wrap input{
    width:100%;padding:13px 44px 13px 16px;border-radius:16px;border:1.5px solid var(--maroon);
    background:var(--card);font-family:'Tajawal';font-size:15px;color:var(--ink);
    outline:none;transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--gold-rich);}
  .search-wrap svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);opacity:.55;}

  main{flex:1;padding:8px 18px 40px;overflow-y:auto;}

  .top-compact{
    display:none;flex-shrink:0;align-items:center;padding:12px 18px 4px;justify-content:flex-end;
  }
  .top-compact .compact-logo{
    font-family:'Aref Ruqaa','Markazi Text',serif;font-weight:700;font-size:19px;
    background:linear-gradient(180deg, var(--gold-rich) 0%, var(--green) 60%, var(--green-deep) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:0.5px;
  }

  /* result cards on home */
  .result-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;margin-top:12px;
    box-shadow: 0 1px 0 rgba(43,33,24,0.03);
  }
  .result-card .rname{font-family:'Markazi Text',serif;font-size:20px;font-weight:700;color:var(--green-deep);line-height:1.5;}
  .result-card .rlayer{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--paper-deep);color:var(--ink-soft);border:1px solid var(--line);
    border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;
  }
  .btn-approve{
    margin-top:10px;width:100%;padding:10px;border:none;border-radius:10px;
    background:var(--green);color:#fff;font-family:'Tajawal';font-weight:700;font-size:14.5px;
    cursor:pointer;transition:background .15s;
  }
  .btn-approve:active{background:var(--green-deep);}
  .btn-wasiyya{
    margin-top:8px;width:100%;padding:10px;border:1.5px solid var(--gold-rich);border-radius:10px;
    background:transparent;color:var(--gold-rich);font-family:'Tajawal';font-weight:700;font-size:14px;
    cursor:pointer;transition:background .15s;
  }
  .btn-wasiyya:active{background:rgba(201,162,39,0.12);}

  .empty-state{
    margin-top:36px;text-align:center;color:var(--muted);
  }
  .empty-state svg{opacity:.35;margin-bottom:10px;}
  .empty-state p{font-size:14px;line-height:1.9;margin:0;}

  /* nasab chain (signature element) */
  .chain-scroll{
    display:flex;gap:0;overflow-x:auto;padding:6px 2px 14px;margin:0 -4px;
    -webkit-overflow-scrolling:touch;
  }
  .chain-scroll::-webkit-scrollbar{height:4px;}
  .chain-node{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:0 10px;position:relative;
  }
  .chain-node:not(:last-child)::after{
    content:'';position:absolute;top:19px;right:-2px;width:22px;height:1.5px;
    background: repeating-linear-gradient(90deg, var(--gold) 0 4px, transparent 4px 7px);
  }
  .chain-medal{
    width:38px;height:38px;border-radius:50%;
    background:var(--card);border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Markazi Text',serif;font-weight:700;color:var(--green-deep);font-size:14px;
  }
  .chain-node.root .chain-medal{background:var(--green);border-color:var(--green-deep);color:#fff;}
  .chain-node.me .chain-medal{background:var(--red);border-color:#5f1420;color:#fff;}
  .chain-node.deceased:not(.me) .chain-medal{background:var(--green);border-color:var(--green-deep);color:#fff;}
  .chain-label{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;max-width:56px;overflow:hidden;text-overflow:ellipsis;}

  /* profile header */
  .profile-hero{
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px 16px;margin-top:10px;
  }
  .profile-name{
    font-family:'Markazi Text',serif;font-weight:700;font-size:24px;color:var(--green-deep);
    line-height:1.5;text-align:center;
  }
  .profile-meta{display:flex;justify-content:center;gap:8px;margin-top:8px;}
  .profile-actions{display:flex;justify-content:center;gap:20px;margin-top:12px;}
  .profile-actions button{
    background:none;border:none;font-family:'Tajawal';font-size:12.5px;font-weight:700;
    cursor:pointer;color:var(--ink-soft);text-decoration:underline;padding:4px;
  }
  .profile-actions button.danger{color:var(--red);}
  .danger-btn{
    width:100%;padding:10px;border-radius:9px;border:1px solid var(--red);
    background:transparent;color:var(--red);font-family:'Tajawal';font-weight:700;font-size:13.5px;
    cursor:pointer;margin-top:10px;transition:background .15s, color .15s;
  }
  .alt-names-section{margin:12px 0;padding:10px;background:var(--paper-deep);border-radius:10px;}
  .alt-names-label{font-size:12px;color:var(--ink-soft);margin:0 0 6px;}
  .alt-names-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .alt-name-tag{
    background:var(--card);border:1px solid var(--gold-rich);border-radius:999px;
    padding:4px 10px;font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;
  }
  .alt-name-remove{color:var(--red);cursor:pointer;font-weight:700;}

  /* relation grid */
  .rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .rel-btn{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 10px;text-align:center;cursor:pointer;transition:transform .1s, border-color .15s;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .rel-btn:active{transform:scale(0.97);}
  .rel-btn .icon{
    width:34px;height:34px;border-radius:50%;background:var(--paper-deep);
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .rel-btn .label{font-weight:700;font-size:13.5px;}
  .rel-btn .count{font-size:11px;color:var(--muted);}

  /* back nav */
  .subheader{display:flex;align-items:flex-start;gap:10px;margin-top:14px;margin-bottom:2px;}
  .back-btn{flex-shrink:0;margin-top:1px;}
  .back-btn{
    width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  }
  .subheader h2{font-family:'Markazi Text',serif;font-size:18px;margin:0;color:var(--green-deep);font-weight:700;line-height:1.5;}

  .person-list-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    cursor:pointer;
  }
  .person-list-card .pname{font-weight:700;font-size:15px;}
  .person-list-card .psub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .chev{opacity:.4;flex:0 0 auto;}

  /* icon grid — 4 per row, phone-keypad style */
  .icon-grid{
    display:grid;grid-template-columns:repeat(4, 1fr);gap:16px 8px;margin-top:16px;
  }
  .icon-tile{
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
    text-align:center;position:relative;
  }
  .icon-tile:active .icon-avatar{transform:scale(0.94);}
  .tile-edit-btn{
    position:absolute;top:-4px;right:6px;
    width:20px;height:20px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;line-height:1;color:var(--muted);cursor:pointer;
    box-shadow:0 1px 3px rgba(43,33,24,0.15);z-index:2;
  }
  .icon-avatar{
    width:56px;height:56px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--paper-deep) 75%);
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'Markazi Text',serif;font-weight:700;font-size:22px;color:var(--green-deep);
    transition:transform .1s;
  }
  .icon-tile.added .icon-avatar{border-color:var(--gold);}
  .icon-tile.deceased .icon-avatar{background:var(--green);border-color:var(--green-deep);color:#fff;}
  .icon-tile.deceased .icon-tile-name{color:var(--green-deep);}
  .icon-tile-name{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-tile-sub{font-size:10px;color:var(--muted);}
  .icon-tile.add-tile .icon-avatar{
    background:rgba(184,134,59,0.08);border:1.5px dashed var(--gold);color:var(--gold);font-size:24px;
  }
  .icon-tile.add-tile .icon-tile-name{color:var(--gold);}

  .add-card{
    border:1.5px dashed var(--gold);border-radius:14px;padding:12px 14px;margin-top:10px;
    display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--gold);background:rgba(184,134,59,0.05);
  }
  .add-card .plus{
    width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:0 0 auto;
  }
  .add-card span.txt{font-weight:700;font-size:14px;}

  .add-form{
    background:var(--card);border:1.5px solid var(--gold);border-radius:14px;padding:14px;margin-top:10px;
  }
  .add-form input[type=text]{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);font-family:'Tajawal';
    font-size:15px;margin-bottom:10px;
  }
  .gender-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .gender-toggle button{
    flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--paper);
    font-family:'Tajawal';font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink-soft);
  }
  .gender-toggle button.active{background:var(--green);color:#fff;border-color:var(--green-deep);}
  .add-form-actions{display:flex;gap:8px;}
  .add-form-actions button{
    flex:1;padding:10px;border-radius:9px;border:none;font-family:'Tajawal';font-weight:700;font-size:14px;cursor:pointer;
  }
  .add-form-actions .save{background:var(--green);color:#fff;}
  .add-form-actions .cancel{background:var(--paper-deep);color:var(--ink-soft);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--green-deep);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,0.2);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .spouse-panel{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .spouse-panel .spouse-label{font-size:13px;color:var(--ink-soft);}
  .spouse-panel .spouse-name{font-weight:700;color:var(--green-deep);}
  .spouse-panel .spouse-edit{background:none;border:none;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;flex-shrink:0;}
  .spouse-panel input{
    flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-family:'Tajawal';font-size:14px;
  }
  .spouse-panel .spouse-save{
    background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 14px;
    font-family:'Tajawal';font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0;
  }
  .section-note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.8;}
  .verse-block{margin-top:44px;text-align:center;padding:0 12px;}
  .verse-text{
    font-family:'Amiri','Markazi Text',serif;font-size:19px;line-height:2.2;
    color:var(--green-deep);font-weight:700;
  }
  .verse-ref{margin-top:16px;font-size:13px;color:var(--gold-rich);font-weight:700;letter-spacing:0.5px;}

  .will-doc{
    background:var(--card);border:1.5px solid var(--gold-rich);border-radius:16px;
    padding:18px 16px;margin-top:14px;text-align:center;
  }
  .will-title{font-family:'Aref Ruqaa','Markazi Text',serif;font-size:22px;font-weight:700;color:var(--green-deep);margin:0 0 10px;}
  .will-line{font-size:14.5px;color:var(--ink);margin:4px 0;}
  .will-narrative{margin-top:16px;}
  .will-root-line{
    font-family:'Markazi Text',serif;font-weight:700;font-size:16.5px;color:var(--green-deep);
    margin:16px 0 4px;
  }
  .will-child-line{
    font-size:14px;color:var(--ink);line-height:1.9;margin:2px 0 2px 0;padding-right:16px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="fullHeader">
    <svg class="arch-deco" viewBox="0 0 300 220" preserveAspectRatio="xMidYMax meet">
      <path d="M 34,220 L 34,108 Q 34,18 150,12 Q 266,18 266,108 L 266,220" fill="none" stroke="var(--gold-rich)" stroke-width="3"/>
      <path d="M 50,220 L 50,112 Q 50,34 150,29 Q 250,34 250,112 L 250,220" fill="none" stroke="var(--gold-line)" stroke-width="1.5"/>
    </svg>
    <div class="brand"><h1>أرحامي</h1></div>
    <div class="search-ornate">
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="اكتب اسمًا... مثلاً: حمد" autocomplete="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5C48" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </div>
    </div>
    <div style="text-align:center;margin-top:10px;position:relative;z-index:1;">
      <button id="backupLink" style="background:none;border:none;color:var(--muted);font-family:'Tajawal';font-size:11.5px;text-decoration:underline;cursor:pointer;">نسخ احتياطي / استعادة</button>
    </div>
  </header>
  <header class="top-compact" id="compactHeader">
    <span class="compact-logo">أرحامي</span>
  </header>
  <div id="backupAnchor"></div>
  <main id="main"></main>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ---------------- Data model ---------------- */
// Each person: id, name (given), gender 'm'/'f', fatherId, motherId, layer, chain (full nasab string), childIds[]
let P = {};
function add(id, name, gender, fatherId, motherId, layer, chain){
  P[id] = {id, name, gender, fatherId: fatherId||null, motherId: motherId||null, layer, chain, childIds:[]};
}
function link(){ // establish childIds from fatherId/motherId
  Object.values(P).forEach(p=>{
    if(p.fatherId && P[p.fatherId]) P[p.fatherId].childIds.push(p.id);
    if(p.motherId && P[p.motherId]) P[p.motherId].childIds.push(p.id);
  });
}

/* ---- Root ancestors ---- */
add('ali_salim','علي بن سالم','m',null,null,1,'علي بن سالم الطوقي');
add('rashid_ali','راشد','m','ali_salim',null,2,'راشد بن علي بن سالم الطوقي');
add('salim_rashid','سليم','m','rashid_ali',null,3,'سليم بن راشد بن علي بن سالم الطوقي');
add('khalfan_salim','خلفان','m','salim_rashid',null,4,'خلفان بن سليم بن راشد بن علي بن سالم الطوقي');
add('rashid_khalfan','راشد','m','khalfan_salim',null,5,'راشد بن خلفان بن سليم بن راشد بن علي بن سالم الطوقي');
add('abdullah_rashid','عبدالله','m','rashid_khalfan',null,6,'عبدالله بن راشد بن خلفان بن سليم بن راشد بن علي بن سالم الطوقي');
add('humaid_abdullah','حميد','m','abdullah_rashid',null,7,'حميد بن عبدالله بن راشد بن خلفان بن سليم بن راشد بن علي بن سالم الطوقي');

// حميد's three wives
add('fatima_abdullah_hamad','فاطمة','f',null,null,7,'فاطمة بنت عبدالله بن حمد الطوقية');
add('riya_muhammad_w2','ريا','f',null,null,7,'ريا بنت محمد الطوقية');
add('zwaina_numaniyah','زوينة','f',null,null,7,'زوينة النعمانية');

// wife 1 children (with فاطمة)
add('hamd_u','حمد','m','humaid_abdullah','fatima_abdullah_hamad',8,'حمد بن حميد بن عبدالله بن راشد بن خلفان بن سليم بن راشد بن علي بن سالم الطوقي');
add('hamood_father','حمود','m','humaid_abdullah','fatima_abdullah_hamad',8,'حمود بن حميد بن عبدالله بن راشد بن خلفان بن سليم بن راشد بن علي بن سالم الطوقي');
add('abdullah_u1','عبدالله','m','humaid_abdullah','fatima_abdullah_hamad',8,'عبدالله بن حميد بن عبدالله بن راشد بن خلفان بن سليم بن راشد بن علي بن سالم الطوقي');
add('aamir_u1','عامر','m','humaid_abdullah','fatima_abdullah_hamad',8,'عامر بن حميد بن عبدالله بن راشد بن خلفان بن سليم بن راشد بن علي بن سالم الطوقي');
add('khalfan_u1','خلفان','m','humaid_abdullah','fatima_abdullah_hamad',8,'خلفان بن حميد بن عبدالله بن راشد بن خلفان بن سليم بن راشد بن علي بن سالم الطوقي');
add('shanoona','شنونة','f','humaid_abdullah','fatima_abdullah_hamad',8,'شنونة بنت حميد بن عبدالله بن راشد بن خلفان بن سليم بن راشد بن علي بن سالم الطوقية');

/* ---------------- Helpers ---------------- */
function chainNodes(person){
  // returns array of {id,name} walking up fatherId chain, ending at the true root (no fatherId)
  const nodes = [];
  let cur = person;
  const guard = new Set();
  while(cur && !guard.has(cur.id)){
    nodes.push(cur);
    guard.add(cur.id);
    cur = cur.fatherId ? P[cur.fatherId] : null;
  }
  return nodes; // [self, father, grandfather, ... root]
}

function siblingsOf(personId, gender){
  const p = P[personId];
  if(!p || !p.fatherId) return [];
  return P[p.fatherId].childIds
    .map(id=>P[id])
    .filter(s=>s.id!==personId && s.gender===gender);
}
function unclesAuntsOf(personId, gender){ // father's siblings
  const p = P[personId];
  if(!p || !p.fatherId) return [];
  const father = P[p.fatherId];
  return siblingsOf(father.id, gender);
}
function unclesAuntsMotherOf(personId, gender){ // mother's siblings
  const p = P[personId];
  if(!p || !p.motherId) return [];
  const mother = P[p.motherId];
  if(!mother || !mother.fatherId) return [];
  return siblingsOf(mother.id, gender);
}
function childrenOf(personId, gender){
  const p = P[personId];
  if(!p) return [];
  return p.childIds.map(id=>P[id]).filter(c=>c.gender===gender);
}

function isAlive(id){ return !!(P[id] && !P[id].isDeceased); }

function computeHeirs(personId){
  const p = P[personId];
  if(!p) return [];
  const heirs = [];
  if(p.fatherId && isAlive(p.fatherId)) heirs.push(P[p.fatherId]);
  if(p.motherId && isAlive(p.motherId)) heirs.push(P[p.motherId]);
  p.childIds.forEach(cid=>{ if(isAlive(cid)) heirs.push(P[cid]); });
  if(p.spouseId && isAlive(p.spouseId)) heirs.push(P[p.spouseId]);
  const asSpouseOf = Object.values(P).find(x=>x.spouseId===personId);
  if(asSpouseOf && isAlive(asSpouseOf.id)) heirs.push(asSpouseOf);
  // grandparents inherit only when the corresponding parent is gone
  if(!p.fatherId || !isAlive(p.fatherId)){
    const father = p.fatherId ? P[p.fatherId] : null;
    if(father){
      if(father.fatherId && isAlive(father.fatherId)) heirs.push(P[father.fatherId]);
      if(father.motherId && isAlive(father.motherId)) heirs.push(P[father.motherId]);
    }
  }
  if(!p.motherId || !isAlive(p.motherId)){
    const mother = p.motherId ? P[p.motherId] : null;
    if(mother){
      if(mother.fatherId && isAlive(mother.fatherId)) heirs.push(P[mother.fatherId]);
      if(mother.motherId && isAlive(mother.motherId)) heirs.push(P[mother.motherId]);
    }
  }
  const seen = new Set(); const unique = [];
  heirs.forEach(h=>{ if(h && !seen.has(h.id)){ seen.add(h.id); unique.push(h); } });
  return unique;
}

function buildDescendantTree(personId, excludeIds){
  const person = P[personId];
  if(!person) return [];
  const kids = person.childIds
    .map(id=>P[id])
    .filter(c=>c && !c.isDeceased && !excludeIds.has(c.id));
  return kids.map(c=>({person:c, children: buildDescendantTree(c.id, excludeIds)}));
}

function addSiblingRoots(personId, categories, excludeIds){
  const brothers = siblingsOf(personId,'m');
  const sisters = siblingsOf(personId,'f');
  brothers.forEach(person=>{
    if(!excludeIds.has(person.id) && !person.isDeceased){
      categories.brothers.push({person, label:'أخي', children: buildDescendantTree(person.id, excludeIds)});
    }
  });
  sisters.forEach(person=>{
    if(!excludeIds.has(person.id) && !person.isDeceased){
      categories.sisters.push({person, label:'أختي', children: buildDescendantTree(person.id, excludeIds)});
    }
  });
}

function addArhamRoots(anchorId, anchorKind, categories, excludeIds){
  if(!anchorId || !P[anchorId]) return;
  const labels = anchorKind==='self'
    ? {uncles:'عمي', aunts:'عمتي', maternal_uncles:'خالي', maternal_aunts:'خالتي'}
    : anchorKind==='father'
    ? {uncles:'عم أبي', aunts:'عمة أبي', maternal_uncles:'خال أبي', maternal_aunts:'خالة أبي'}
    : {uncles:'عم أمي', aunts:'عمة أمي', maternal_uncles:'خال أمي', maternal_aunts:'خالة أمي'};
  const groups = [
    ['uncles', unclesAuntsOf(anchorId,'m')],
    ['aunts', unclesAuntsOf(anchorId,'f')],
    ['maternal_uncles', unclesAuntsMotherOf(anchorId,'m')],
    ['maternal_aunts', unclesAuntsMotherOf(anchorId,'f')]
  ];
  groups.forEach(([key,list])=>{
    list.forEach(person=>{
      if(!excludeIds.has(person.id) && !person.isDeceased){
        categories[key].push({person, label:labels[key], children: buildDescendantTree(person.id, excludeIds)});
      }
    });
  });
}

function computeArhamTree(personId){
  const p = P[personId];
  const categories = {brothers:[], sisters:[], uncles:[], aunts:[], maternal_uncles:[], maternal_aunts:[]};
  if(!p) return categories;
  const heirs = computeHeirs(personId);
  const excludeIds = new Set(heirs.map(h=>h.id));
  excludeIds.add(personId);
  addSiblingRoots(personId, categories, excludeIds);
  addArhamRoots(personId, 'self', categories, excludeIds);
  if(p.fatherId) addArhamRoots(p.fatherId, 'father', categories, excludeIds);
  if(p.motherId) addArhamRoots(p.motherId, 'mother', categories, excludeIds);
  return categories;
}

function countTreeNodes(nodes){
  let n = 0;
  nodes.forEach(node=>{ n += 1 + countTreeNodes(node.children); });
  return n;
}
function countCategories(categories){
  return countTreeNodes(categories.brothers) + countTreeNodes(categories.sisters) +
         countTreeNodes(categories.uncles) + countTreeNodes(categories.aunts) +
         countTreeNodes(categories.maternal_uncles) + countTreeNodes(categories.maternal_aunts);
}
function flattenByDepth(node){
  let levels = [];
  let current = [node];
  while(current.length>0){
    let next = [];
    current.forEach(n=>{ next.push(...n.children); });
    if(next.length===0) break;
    levels.push(next.map(n=>n.person.name));
    current = next;
  }
  return levels;
}
function describeSubtree(node){
  const levels = flattenByDepth(node);
  if(levels.length===0) return node.person.name;
  const suffix = node.person.gender==='m' ? 'ه' : 'ها';
  const labelWords = ['أولاد','أحفاد','أبناء أحفاد','أحفاد أحفاد'];
  let parts = [node.person.name];
  levels.forEach((names, idx)=>{
    const labelBase = labelWords[idx] || ('الجيل ' + (idx+2));
    parts.push(`و${labelBase}${suffix} ` + names.join(' و'));
  });
  return parts.join(' ');
}

function addTargetFor(personId, relKey){
  const person = P[personId];
  if(!person) return null;
  if(relKey==='children'){
    if(person.gender==='f'){
      // a child is never nasab-linked to the mother — must go through her registered husband
      if(!person.spouseId || !P[person.spouseId]) return null;
      return {parentId:person.spouseId, motherId:personId, gender:'m'};
    }
    return {parentId:personId, gender:'m'};
  }
  if(relKey==='siblings') return person.fatherId ? {parentId:person.fatherId, gender:'m'} : null;
  if(relKey==='paternal') return (person.fatherId && P[person.fatherId] && P[person.fatherId].fatherId) ? {parentId:P[person.fatherId].fatherId, gender:'m'} : null;
  if(relKey==='maternal') return (person.motherId && P[person.motherId] && P[person.motherId].fatherId) ? {parentId:P[person.motherId].fatherId, gender:'m'} : null;
  return null;
}

function isChainSource(child, parentId){
  return child.fatherId===parentId || (!child.fatherId && child.motherId===parentId);
}

function applyChainGenderSuffix(chain, gender){
  // the final nisba/tribal word must agree with the chain's own subject (leftmost person),
  // not with whichever parent chain it was built from
  const words = chain.split(' ');
  let last = words[words.length-1];
  if(gender==='f'){
    if(last.endsWith('ي') && !last.endsWith('ية')) last = last + 'ة';
  } else {
    if(last.endsWith('ية')) last = last.slice(0,-1);
  }
  words[words.length-1] = last;
  return words.join(' ');
}

function rebuildDescendantChains(personId){
  const p = P[personId];
  if(!p) return;
  p.childIds.forEach(cid=>{
    const child = P[cid];
    if(!child || !isChainSource(child, personId)) return;
    const connector = child.gender==='m' ? 'بن' : 'بنت';
    child.chain = applyChainGenderSuffix(`${child.name} ${connector} ${p.chain}`, child.gender);
    rebuildDescendantChains(cid);
  });
}

function renamePerson(personId, newName){
  const person = P[personId];
  if(!person) return;
  const oldName = person.name;
  person.name = newName;
  person.chain = newName + person.chain.slice(oldName.length);
  renameLog[personId] = newName;
  rebuildDescendantChains(personId);
}

function setDeceased(personId, val){
  const person = P[personId];
  if(!person) return;
  person.isDeceased = val;
  deceasedLog[personId] = val;
}

function addAltName(personId, name){
  const person = P[personId];
  if(!person || !name) return;
  if(!person.altNames) person.altNames = [];
  if(!person.altNames.includes(name)) person.altNames.push(name);
  altNamesLog[personId] = person.altNames.slice();
}

function removeAltName(personId, name){
  const person = P[personId];
  if(!person || !person.altNames) return;
  person.altNames = person.altNames.filter(n=>n!==name);
  altNamesLog[personId] = person.altNames.slice();
}

function setWillAmount(ownerId, relativeId, amount){
  if(!amountsLog[ownerId]) amountsLog[ownerId] = {};
  amountsLog[ownerId][relativeId] = amount;
}

function registerSpouse(personId, spouseName){
  const person = P[personId];
  if(!person) return null;
  // try to match an existing registered man by exact full nasab, or by short name if that's all that was typed
  const existingMatch = Object.values(P).filter(p=>p.gender==='m' && (p.chain===spouseName || p.name===spouseName));
  let spouseId;
  if(existingMatch.length===1){
    spouseId = existingMatch[0].id;
  } else {
    // no unambiguous match — create a minimal stub so children still have a real father node to attach to
    spouseId = 'spouse_'+personId;
    if(!P[spouseId]){
      add(spouseId, spouseName, 'm', null, null, person.layer, spouseName);
      P[spouseId].isSpouseStub = true;
      addedByUser.add(spouseId);
    } else {
      renamePerson(spouseId, spouseName);
    }
  }
  person.spouseId = spouseId;
  person.spouseName = spouseName;
  spouseLog[personId] = {name:spouseName, spouseId};
  return spouseId;
}

function countDescendants(personId){
  const p = P[personId];
  if(!p) return 0;
  let count = 0;
  p.childIds.forEach(cid=>{
    const child = P[cid];
    if(!child || !isChainSource(child, personId)) return;
    count += 1 + countDescendants(cid);
  });
  return count;
}

function deletePerson(personId){
  const p = P[personId];
  if(!p) return;
  const kids = p.childIds.filter(cid=>{
    const child = P[cid];
    return child && isChainSource(child, personId);
  });
  kids.forEach(cid=>deletePerson(cid));
  if(p.fatherId && P[p.fatherId]) P[p.fatherId].childIds = P[p.fatherId].childIds.filter(x=>x!==personId);
  if(p.motherId && P[p.motherId]) P[p.motherId].childIds = P[p.motherId].childIds.filter(x=>x!==personId);
  deletedIds.add(personId);
  addedByUser.delete(personId);
  delete P[personId];
}

function findDuplicateGroups(){
  const groups = {};
  Object.values(P).forEach(p=>{
    if(!groups[p.chain]) groups[p.chain] = [];
    groups[p.chain].push(p.id);
  });
  return Object.values(groups).filter(ids=>ids.length>1);
}

function mergeOneDuplicate(canonicalId, dupId){
  const dup = P[dupId];
  const canonical = P[canonicalId];
  if(!dup || !canonical) return;
  dup.childIds.forEach(cid=>{
    const child = P[cid];
    if(!child) return;
    if(child.fatherId===dupId) child.fatherId = canonicalId;
    if(child.motherId===dupId) child.motherId = canonicalId;
    if(!canonical.childIds.includes(cid)) canonical.childIds.push(cid);
  });
  Object.values(P).forEach(p=>{
    if(p.spouseId===dupId) p.spouseId = canonicalId;
  });
  if(dup.fatherId && P[dup.fatherId]) P[dup.fatherId].childIds = P[dup.fatherId].childIds.filter(x=>x!==dupId);
  if(dup.motherId && P[dup.motherId]) P[dup.motherId].childIds = P[dup.motherId].childIds.filter(x=>x!==dupId);
  if(dup.isDeceased && !canonical.isDeceased){ canonical.isDeceased = true; deceasedLog[canonicalId] = true; }
  if(dup.altNames && dup.altNames.length){
    if(!canonical.altNames) canonical.altNames = [];
    dup.altNames.forEach(n=>{ if(!canonical.altNames.includes(n)) canonical.altNames.push(n); });
    altNamesLog[canonicalId] = canonical.altNames.slice();
  }
  if(dup.spouseId && !canonical.spouseId){
    canonical.spouseId = dup.spouseId;
    canonical.spouseName = dup.spouseName;
    spouseLog[canonicalId] = {name:dup.spouseName, spouseId:dup.spouseId};
  }
  deletedIds.add(dupId);
  addedByUser.delete(dupId);
  delete P[dupId];
}

function mergeAllDuplicates(){
  // intentionally not auto-merging: two real distinct people (e.g. half-siblings sharing
  // a name) can have an identical computed chain, so every group needs human confirmation
  // — see openMergeDuplicatesPanel for the safe, per-group review flow.
  return findDuplicateGroups();
}

const main = document.getElementById('main');
const searchInput = document.getElementById('searchInput');
let state = {view:'home', personId:null, pendingApprove:null};
let history = [];
function goTo(next){
  history.push(JSON.parse(JSON.stringify(state)));
  state = Object.assign({}, state, next);
  render();
}
function goBack(){
  if(history.length>0){
    state = history.pop();
  } else {
    state = {view:'home', personId:null};
  }
  render();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function render(){
  const isHome = state.view==='home';
  document.getElementById('fullHeader').style.display = isHome ? '' : 'none';
  document.getElementById('compactHeader').style.display = isHome ? 'none' : 'flex';
  if(state.view==='home') renderHome();
  else if(state.view==='profile') renderProfile(state.personId);
  else if(state.view==='relation') renderRelation(state.personId, state.relKey);
  else if(state.view==='wasiyya') renderWasiyya(state.personId);
}

function renderChain(person){
  const nodes = chainNodes(person).reverse(); // root -> person
  let html = '<div class="chain-scroll">';
  nodes.forEach((n,i)=>{
    const isRoot = i===0;
    const isMe = i===nodes.length-1;
    const deceased = n.isDeceased ? 'deceased' : '';
    html += `<div class="chain-node ${isRoot?'root':''} ${isMe?'me':''} ${deceased}">
      <div class="chain-medal">${n.name.charAt(0)}</div>
      <div class="chain-label">${n.name}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

      <p class="verse-ref">سورة الأحزاب: ٦</p>
    </div>`;
    return;
  }
  const results = Object.values(P).filter(p=>{

    return own && p.layer>=8;
  }).sort((a,b)=> a.name.localeCompare(b.name, 'ar'));
  if(results.length===0){
    main.innerHTML = `<div class="empty-state">
      <p>لا توجد نتائج لهذا الاسم بعد.<br>يمكن إضافته لاحقًا من صفحة أحد أقاربه.</p>
    </div>`;
    return;
  }
  main.innerHTML = results.map(p=>`
    <div class="result-card">
      <div class="rname">${p.chain}</div>
      <div class="rlayer"><span class="badge">الطبقة ${p.layer}</span></div>
      <button class="btn-approve" data-id="${p.id}">موافق</button>
      <button class="btn-wasiyya" data-id="${p.id}">📜 وصية الأقربين</button>
    </div>
  `).join('');
  main.querySelectorAll('.btn-approve').forEach(b=>{
    b.onclick = ()=>{ goTo({view:'profile', personId:b.dataset.id}); };
  });
  main.querySelectorAll('.btn-wasiyya').forEach(b=>{
    b.onclick = ()=>{ goTo({view:'wasiyya', personId:b.dataset.id}); };
  });
}

function openAddForm(parentId, gender, motherIdOverride){
  const form = document.createElement('div');
  form.className='add-form';
  const fieldsHtml = Array.from({length:6}).map((_,i)=>
    `<input type="text" class="newNameInput" placeholder="اسم ${i+1}" style="margin-bottom:8px;">`
  ).join('');
  form.innerHTML = `
    ${fieldsHtml}
    <div class="gender-toggle">
      <button type="button" data-g="m" class="${gender==='m'?'active':''}">ذكر</button>
      <button type="button" data-g="f" class="${gender==='f'?'active':''}">أنثى</button>
    </div>
    <div class="add-form-actions">
      <button class="save" id="saveNew">حفظ</button>
      <button class="cancel" id="cancelNew">إلغاء</button>
    </div>
  `;
  main.appendChild(form);
  form.scrollIntoView({behavior:'smooth', block:'center'});
  let chosenGender = gender;
  form.querySelectorAll('.gender-toggle button').forEach(b=>{
    b.onclick = ()=>{
      chosenGender = b.dataset.g;
      form.querySelectorAll('.gender-toggle button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    };
  });
  document.getElementById('cancelNew').onclick = ()=>{ form.remove(); };
  document.getElementById('saveNew').onclick = ()=>{
    const names = Array.from(form.querySelectorAll('.newNameInput'))
      .map(input=>input.value.trim())
      .filter(name=>name.length>0);
    if(names.length===0){ showToast('اكتب اسمًا واحدًا على الأقل'); return; }
    const parent = P[parentId]; // always the father (husband) when motherIdOverride is set — nasab always follows the father
    const connector = chosenGender==='m' ? 'بن' : 'بنت';
    let linkedCount = 0, createdCount = 0;
    names.forEach(name=>{
      const chain = applyChainGenderSuffix(`${name} ${connector} ${parent.chain}`, chosenGender);
      const fatherId = motherIdOverride ? parentId : (parent.gender==='m' ? parentId : null);
      const motherId = motherIdOverride ? motherIdOverride : (parent.gender==='f' ? parentId : null);
      // an identical full chain means this is the SAME real person already recorded elsewhere —
      // link them here instead of creating a confusing duplicate record
      const existing = Object.values(P).find(p=>p.chain===chain && p.id!==parentId);
      let newId;
      if(existing){
        newId = existing.id;
        linkedCount++;
      } else {
        newId = 'u_'+(idCounter++);
        add(newId, name, chosenGender, fatherId, motherId, parent.layer+1, chain);
        addedByUser.add(newId);
        createdCount++;
      }
      if(!parent.childIds.includes(newId)) parent.childIds.push(newId);
      if(motherIdOverride && P[motherIdOverride] && !P[motherIdOverride].childIds.includes(newId)){
        P[motherIdOverride].childIds.push(newId);
      }
    });
    persistState();
    if(linkedCount>0){
      showToast(linkedCount===names.length ? 'الاسم موجود مسبقًا — تم الربط بدل التكرار' : `تمت الإضافة (${linkedCount} منها كان مسجّلًا فرُبط بدل التكرار)`);
    } else {
      showToast(names.length>1 ? `تمت إضافة ${names.length} أسماء` : 'تمت الإضافة');
    }
    form.remove();
    render();
  };
}

    showToast('تم الحذف');
    if(wasViewingSelf) goBack(); else render();
    return;
  }
  btn.dataset.armed = '1';
  const original = btn.textContent;
  btn.textContent = 'اضغط مرة أخرى للتأكيد';
  btn.style.background = 'var(--red)';
  btn.style.color = '#fff';
  setTimeout(()=>{
    if(btn.isConnected){
      btn.dataset.armed = '0';
      btn.textContent = original;
      btn.style.background = '';
      btn.style.color = '';
    }
  }, 3000);
}

/* shared persistence — visible and editable by anyone who opens this link */
/* storage adapter — window.storage exists only inside Claude's artifact preview.
   Once this file is deployed as a real website, fall back to the browser's own
   localStorage so each visitor still gets reliable persistence across visits. */
const storageAdapter = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function')
  ? {
      async get(key){ return window.storage.get(key, true); },
      async set(key, value){ return window.storage.set(key, value, true); }
    }
  : {
      async get(key){
        const v = localStorage.getItem(key);
        if(v===null) throw new Error('not found');
        return {key, value:v};
      },
      async set(key, value){
        localStorage.setItem(key, value);
        return {key, value};
      }
    };

let storageAvailable = null; // null = unknown yet, true/false once tested
let persistQueue = Promise.resolve();

function buildPayload(){
  return {
    adds: Array.from(addedByUser).map(id=>P[id]).filter(Boolean),
    renames: Object.assign({}, renameLog),
    spouses: Object.assign({}, spouseLog),
    deceased: Object.assign({}, deceasedLog),
    altNames: JSON.parse(JSON.stringify(altNamesLog)),
    amounts: JSON.parse(JSON.stringify(amountsLog)),
    deletes: Array.from(deletedIds)
  };
}

function persistState(){
  const json = JSON.stringify(buildPayload());
  persistQueue = persistQueue.then(async ()=>{
    try{
      await storageAdapter.set('arhami:family_data', json);
      storageAvailable = true;
    }catch(e){
      storageAvailable = false;
      showToast('⚠️ تعذّر الحفظ الدائم — انسخ نسخة احتياطية من زر "نسخ احتياطي" أسفل شريط البحث');
    }
  });
  return persistQueue;
}

async function testStorage(){
  try{
    await storageAdapter.set('arhami:_probe', String(Date.now()));
    const r = await storageAdapter.get('arhami:_probe');
    storageAvailable = !!(r && r.value);
  }catch(e){
    storageAvailable = false;
  }
}

async function restoreState(){
  await testStorage();
  try{
    const res = await storageAdapter.get('arhami:family_data');
    if(res && res.value){
      applyPayload(JSON.parse(res.value));
    }
  }catch(e){ /* first run or storage unavailable */ }
  render();
}

function applyPayload(payload){
  (payload.adds||[]).forEach(it=>{
    if(!P[it.id]){
      add(it.id, it.name, it.gender, it.fatherId, it.motherId, it.layer, it.chain);
      addedByUser.add(it.id);
      if(it.fatherId && P[it.fatherId] && !P[it.fatherId].childIds.includes(it.id)) P[it.fatherId].childIds.push(it.id);
      if(it.motherId && P[it.motherId] && !P[it.motherId].childIds.includes(it.id)) P[it.motherId].childIds.push(it.id);
      if(it.spouseName){ P[it.id].spouseName = it.spouseName; }
      if(it.isDeceased){ P[it.id].isDeceased = true; }
      if(it.altNames && it.altNames.length){ P[it.id].altNames = it.altNames.slice(); }
    }
  });
  idCounter = Math.max(idCounter, (payload.adds||[]).length + 1);
  Object.keys(payload.renames||{}).forEach(id=>{
    if(P[id] && P[id].name !== payload.renames[id]){
      renamePerson(id, payload.renames[id]);
    }
  });
  Object.keys(payload.deceased||{}).forEach(id=>{
    if(P[id]){
      P[id].isDeceased = payload.deceased[id];
      deceasedLog[id] = payload.deceased[id];
    }
  });
  Object.keys(payload.altNames||{}).forEach(id=>{
    if(P[id]){
      P[id].altNames = (payload.altNames[id]||[]).slice();
      altNamesLog[id] = P[id].altNames.slice();
    }
  });
  Object.keys(payload.amounts||{}).forEach(ownerId=>{
    if(!amountsLog[ownerId]) amountsLog[ownerId] = {};
    Object.assign(amountsLog[ownerId], payload.amounts[ownerId]);
  });
  Object.keys(payload.spouses||{}).forEach(id=>{
    if(P[id]){
      const entry = payload.spouses[id];
      if(entry && typeof entry === 'object'){
        P[id].spouseName = entry.name;
        P[id].spouseId = entry.spouseId;
        spouseLog[id] = entry;
      } else if(entry){
        // legacy plain-string format from an earlier version — recreate as a proper linked node
        registerSpouse(id, entry);
      }
    }
  });
  (payload.deletes||[]).forEach(id=>{
    if(P[id]) deletePerson(id);
    deletedIds.add(id);
  });
}

      <button class="cancel" id="closeBackupBtn">إغلاق</button>
    </div>
    <button class="danger-btn" id="mergeDupBtn" style="border-color:var(--gold-rich);color:var(--gold-rich);margin-top:14px;">مراجعة الأسماء المتطابقة</button>
  `;
  anchor.appendChild(panel);
  panel.scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('mergeDupBtn').onclick = ()=>openMergeDuplicatesPanel();
  document.getElementById('exportBtn').onclick = ()=>{
    const json = JSON.stringify(buildPayload());
    const ta = document.getElementById('backupText');
    ta.value = json;
    ta.select();
    try{ document.execCommand('copy'); showToast('تم النسخ — احفظه بمكان آمن'); }
    catch(e){ showToast('انسخ النص يدويًا من المربع'); }
  };
  document.getElementById('importBtn').onclick = ()=>{
    const raw = document.getElementById('backupText').value.trim();
    if(!raw){ showToast('الصق نسخة احتياطية أولًا'); return; }
    try{
      const payload = JSON.parse(raw);
      applyPayload(payload);
      persistState();
      showToast('تم الاستيراد');
      panel.remove();
      render();
    }catch(e){ showToast('النص غير صالح'); }
  };
  document.getElementById('closeBackupBtn').onclick = ()=>panel.remove();
}

searchInput.addEventListener('input', ()=>{ if(state.view!=='home'){ history=[]; state={view:'home', personId:null}; } render(); });
document.getElementById('backupLink').addEventListener('click', openBackupPanel);

restoreState();
</script>
</body>
</html>
